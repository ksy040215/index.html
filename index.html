<!DOCTYPE html>
<html lang="ko">
<head>
  <title>팀폴리오</title>
  <meta name="description" content="사이트에 대한 한 줄 설명">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Teamfolio — 팀플의 모든 과정을 하나의 페이지로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;
  --wash:#f5f6fd;
  --card:#ffffff;
  --line:#e6e8f5;
  --line-strong:#d3d7ee;
  --ink:#151733;
  --ink-2:#5f6486;
  --ink-3:#8b90ad;
  --blue:#3b5bff;
  --blue-deep:#2a45d8;
  --violet:#8b4bf6;
  --tint:#eef1ff;
  --tint-violet:#f4edff;
  --ok:#17a672;
  --shadow:0 1px 2px rgba(21,23,51,.05), 0 10px 30px rgba(21,23,51,.07);
  --shadow-sm:0 1px 2px rgba(21,23,51,.05);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1120; --wash:#151830; --card:#171a2e; --line:#282c48; --line-strong:#353a5e;
    --ink:#eef0fb; --ink-2:#a7acc9; --ink-3:#7f85a6;
    --blue:#7d95ff; --blue-deep:#6a83f8; --violet:#b088ff;
    --tint:#1e2342; --tint-violet:#251e45; --ok:#3ecf9a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#0f1120; --wash:#151830; --card:#171a2e; --line:#282c48; --line-strong:#353a5e;
  --ink:#eef0fb; --ink-2:#a7acc9; --ink-3:#7f85a6;
  --blue:#7d95ff; --blue-deep:#6a83f8; --violet:#b088ff;
  --tint:#1e2342; --tint-violet:#251e45; --ok:#3ecf9a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  font-size:15.5px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all;
}
h1,h2,h3,h4,.display{font-family:"Gothic A1","Apple SD Gothic Neo",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
p{margin:0}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
input,textarea,select{font:inherit}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.stack{display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:62px}
.brand{display:flex;align-items:center;gap:9px;font-family:"Gothic A1",sans-serif;font-weight:800;font-size:19px;letter-spacing:-.03em;background:none;border:0;padding:0;cursor:pointer}
.mark{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,var(--blue),var(--violet));position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:7px 7px auto 7px;height:3px;border-radius:2px;background:#fff;box-shadow:0 6px 0 rgba(255,255,255,.75)}
.spacer{flex:1}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;border:1px solid transparent;padding:10px 17px;font-weight:600;font-size:14.5px;cursor:pointer;background:transparent;transition:background .15s,border-color .15s,transform .12s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(59,91,255,.25)}
.btn-primary:hover{background:var(--blue-deep)}
.btn-outline{border-color:var(--line-strong);color:var(--ink);background:var(--card)}
.btn-outline:hover{border-color:var(--blue);color:var(--blue)}
.btn-ghost{color:var(--ink-2)}
.btn-ghost:hover{background:var(--wash);color:var(--ink)}
.btn-lg{padding:14px 26px;font-size:16px;border-radius:13px}
.btn-sm{padding:7px 12px;font-size:13.5px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- home ---------- */
.hero{padding:72px 0 8px}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--blue);background:var(--tint);border-radius:999px;padding:6px 13px;margin-bottom:22px}
.hero h1{font-size:clamp(34px,5.2vw,52px);font-weight:800;line-height:1.16}
.hero .sub{margin-top:18px;color:var(--ink-2);font-size:17px;max-width:44ch}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.hero-note{margin-top:16px;font-size:13.5px;color:var(--ink-3)}

/* hero visual: scattered scraps -> one page */
.scene{position:relative;height:360px}
.scrap{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--ink-2);box-shadow:var(--shadow-sm);width:196px}
.scrap b{display:block;color:var(--ink);font-weight:600;font-size:13.5px;margin-bottom:2px}
.s1{left:0;top:22px;transform:rotate(-7deg);animation:settle1 .9s cubic-bezier(.2,.8,.3,1) both}
.s2{left:10px;top:136px;transform:rotate(4deg);animation:settle2 .9s .08s cubic-bezier(.2,.8,.3,1) both}
.s3{left:-4px;top:246px;transform:rotate(-3deg);animation:settle3 .9s .16s cubic-bezier(.2,.8,.3,1) both}
@keyframes settle1{from{opacity:0;transform:translate(-26px,-14px) rotate(-18deg)}to{opacity:1;transform:rotate(-7deg)}}
@keyframes settle2{from{opacity:0;transform:translate(-30px,10px) rotate(16deg)}to{opacity:1;transform:rotate(4deg)}}
@keyframes settle3{from{opacity:0;transform:translate(-22px,26px) rotate(-14deg)}to{opacity:1;transform:rotate(-3deg)}}
.arrow{position:absolute;left:202px;top:170px;width:44px;height:2px;background:linear-gradient(90deg,var(--blue),var(--violet));border-radius:2px}
.arrow::after{content:"";position:absolute;right:-1px;top:-4px;width:10px;height:10px;border-top:2px solid var(--violet);border-right:2px solid var(--violet);transform:rotate(45deg)}
.folio{position:absolute;right:0;top:12px;width:min(300px,100%);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;animation:rise .8s .3s cubic-bezier(.2,.8,.3,1) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.folio-top{height:7px;background:linear-gradient(90deg,var(--blue),var(--violet))}
.folio-body{padding:18px}
.folio h4{font-size:17px;font-weight:800}
.folio .fsub{font-size:13px;color:var(--ink-2);margin-top:4px}
.folio-rows{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.folio-row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex:none}
.dot.v{background:var(--violet)}
.folio-bar{height:7px;border-radius:99px;background:var(--wash);margin-top:16px;overflow:hidden}
.folio-bar i{display:block;height:100%;width:76%;background:linear-gradient(90deg,var(--blue),var(--violet));border-radius:99px}
.avatars{display:flex;margin-top:14px}
.av{width:26px;height:26px;border-radius:50%;background:var(--tint);border:2px solid var(--card);margin-left:-7px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--blue)}
.av:first-child{margin-left:0}

/* section headings */
.sec{padding:64px 0}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.sec-head h2{font-size:26px;font-weight:800}
.sec-head p{color:var(--ink-2);font-size:15px;margin-top:6px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-sm)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.ex{padding:20px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:12px;transition:border-color .15s,box-shadow .15s}
.ex:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.ex .tag{align-self:flex-start;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--blue)}
.ex .tag.v{background:var(--tint-violet);color:var(--violet)}
.ex h3{font-size:17.5px;font-weight:700;line-height:1.35}
.ex p{font-size:13.5px;color:var(--ink-2)}
.ex .meta{font-size:12.5px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.soon{opacity:.72}

/* template cards */
.tpl{padding:24px;display:flex;flex-direction:column;gap:14px;text-align:left;cursor:pointer;border-width:1.5px;transition:border-color .15s,box-shadow .15s,background .15s}
.tpl:hover{border-color:var(--line-strong)}
.tpl[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--tint)}
.tpl-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--tint)}
.tpl h3{font-size:19px;font-weight:800}
.tpl .desc{font-size:14px;color:var(--ink-2)}
.chiplist{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px}
.chip{font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--wash);color:var(--ink-2);border:1px solid var(--line)}
.chip.blue{background:var(--tint);color:var(--blue);border-color:transparent}
.chip.violet{background:var(--tint-violet);color:var(--violet);border-color:transparent}

/* steps indicator */
.steps{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-3);flex-wrap:wrap}
.steps b{color:var(--ink);font-weight:600}
.steps .sep{width:16px;height:1px;background:var(--line-strong)}

/* editor */
.editor{display:grid;grid-template-columns:232px minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start;padding:24px 0 80px}
.side{position:sticky;top:78px;display:flex;flex-direction:column;gap:3px}
.side button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border:0;border-radius:10px;background:transparent;cursor:pointer;font-size:14px;color:var(--ink-2)}
.side button:hover{background:var(--wash);color:var(--ink)}
.side button[aria-current="true"]{background:var(--tint);color:var(--blue);font-weight:600}
.side .num{width:20px;height:20px;border-radius:7px;background:var(--wash);display:grid;place-items:center;font-size:11.5px;color:var(--ink-3);flex:none}
.side button[aria-current="true"] .num{background:var(--blue);color:#fff}
.form{display:flex;flex-direction:column;gap:16px;min-width:0}
.fieldset{padding:20px;scroll-margin-top:86px}
.fieldset h3{font-size:16.5px;font-weight:800;margin-bottom:3px}
.fieldset .hint{font-size:13px;color:var(--ink-3);margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.field:last-child{margin-bottom:0}
.field label{font-size:13.5px;font-weight:600;color:var(--ink-2)}
.input,.textarea{width:100%;background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:10px 12px;color:var(--ink);font-size:14.5px}
.input::placeholder,.textarea::placeholder{color:var(--ink-3)}
.input:focus,.textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--tint)}
.textarea{min-height:96px;resize:vertical;line-height:1.6}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rowcard{border:1px solid var(--line);border-radius:var(--r-sm);padding:13px;background:var(--wash);margin-bottom:10px}
.rowcard-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.rowcard-head span{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.del{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:7px}
.del:hover{color:#e04a5f;background:var(--paper)}
.add{width:100%;border:1.5px dashed var(--line-strong);background:transparent;color:var(--blue);border-radius:var(--r-sm);padding:10px;font-weight:600;font-size:14px;cursor:pointer}
.add:hover{background:var(--tint);border-color:var(--blue)}
.range{width:100%;accent-color:var(--blue)}
.tagrow{display:flex;gap:8px}
.tagchip{display:inline-flex;align-items:center;gap:7px;background:var(--tint);color:var(--blue);border:0;border-radius:999px;padding:6px 8px 6px 12px;font-size:13px;font-weight:600}
.tagchip button{border:0;background:transparent;color:inherit;cursor:pointer;opacity:.7;line-height:1;font-size:15px}
.tagchip button:hover{opacity:1}

/* preview column */
.preview-col{position:sticky;top:78px;min-width:0}
.preview-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.preview-head .t{font-size:13px;color:var(--ink-3);font-weight:600}
.preview-frame{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--wash);overflow:hidden;box-shadow:var(--shadow)}
.preview-bar{display:flex;align-items:center;gap:6px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.pd{width:9px;height:9px;border-radius:50%;background:var(--line-strong)}
.preview-url{flex:1;text-align:center;font-size:11.5px;color:var(--ink-3);background:var(--wash);border-radius:7px;padding:3px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.preview-scroll{max-height:calc(100vh - 190px);overflow:auto;padding:16px;background:var(--wash)}
.mobile-switch{display:none}

/* result page */
.result-head{padding:44px 0 26px;border-bottom:1px solid var(--line)}
.result-head h1{font-size:clamp(28px,4.4vw,42px);font-weight:800;line-height:1.2;max-width:22ch}
.result-head .tagline{margin-top:14px;font-size:17.5px;color:var(--ink-2);max-width:56ch}
.metarow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.anchorbar{position:sticky;top:62px;z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.anchorbar .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
.anchorbar .wrap::-webkit-scrollbar{display:none}
.anchorbar button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.anchorbar button:hover{background:var(--wash);color:var(--ink)}
.anchorbar button[aria-current="true"]{background:var(--tint);color:var(--blue);font-weight:600}
.sections{display:flex;flex-direction:column;gap:20px;padding:32px 0 90px}
.block{padding:26px;scroll-margin-top:130px}
.block > h2{font-size:20px;font-weight:800;margin-bottom:4px}
.block > .bsub{font-size:13.5px;color:var(--ink-3);margin-bottom:20px}
.body-text{color:var(--ink-2);white-space:pre-wrap;line-height:1.75;max-width:74ch}

.member{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0;padding-bottom:0}
.member:first-child{padding-top:0}
.ava{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--tint);color:var(--blue);flex:none}
.ava.v{background:var(--tint-violet);color:var(--violet)}
.member .nm{font-weight:600}
.member .rl{font-size:13.5px;color:var(--ink-2)}

.stage{margin-bottom:14px}
.stage:last-child{margin-bottom:0}
.stage-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
.stage-top .pc{color:var(--ink-2);font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:99px;background:var(--wash);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .4s ease}
.overall{display:flex;align-items:baseline;gap:10px;margin-bottom:18px}
.overall .big{font-family:"Gothic A1",sans-serif;font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.overall .lb{font-size:13.5px;color:var(--ink-3)}

.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:9px 0}
.tl-item::before{content:"";position:absolute;left:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2.5px solid var(--blue)}
.tl-item.done::before{background:var(--blue)}
.tl-item .d{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tl-item .t{font-weight:600}

.steplist{counter-reset:s;display:flex;flex-direction:column;gap:2px}
.stepitem{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.stepitem:last-child{border-bottom:0}
.stepitem .sn{width:26px;height:26px;border-radius:9px;background:var(--tint);color:var(--blue);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;font-variant-numeric:tabular-nums}
.stepitem h4{font-size:15.5px;font-weight:700;margin-bottom:3px}
.stepitem p{font-size:14px;color:var(--ink-2)}

.pslist{display:flex;flex-direction:column;gap:14px}
.ps{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.ps .p{padding:13px 15px;background:var(--wash)}
.ps .s{padding:13px 15px;border-top:1px solid var(--line)}
.ps .k{font-size:12px;font-weight:700;color:var(--ink-3);margin-bottom:3px}
.ps .s .k{color:var(--blue)}

.outs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.out{border:1px solid var(--line);border-radius:var(--r-sm);padding:15px;display:flex;flex-direction:column;gap:5px;background:var(--card)}
.out .on{font-weight:700}
.out .od{font-size:13.5px;color:var(--ink-2)}
.out a{font-size:13px;word-break:break-all}

.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.metric{border:1px solid var(--line);border-radius:var(--r-sm);padding:16px;background:var(--wash)}
.metric .mv{font-family:"Gothic A1",sans-serif;font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.metric .ml{font-size:12.5px;color:var(--ink-2);margin-top:5px}

.reflist{display:flex;flex-direction:column;gap:11px}
.ref{display:flex;gap:11px;font-size:14px}
.ref .rn{color:var(--ink-3);font-variant-numeric:tabular-nums;flex:none}
.ref .rt{font-weight:500}
.ref .rs{color:var(--ink-3);font-size:13px}

.meet{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;margin-bottom:10px;background:var(--card)}
.meet:last-child{margin-bottom:0}
.meet .mh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.meet .md{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.meet .mt{font-weight:700}
.meet .ma{font-size:12.5px;color:var(--ink-3)}
.meet .mb{font-size:14px;color:var(--ink-2);white-space:pre-wrap}

.empty{color:var(--ink-3);font-size:14px;border:1.5px dashed var(--line-strong);border-radius:var(--r-sm);padding:16px;text-align:center}

/* present mode */
.present{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;flex-direction:column}
.present-top{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.present-body{flex:1;overflow:auto;display:grid;place-items:center;padding:28px}
.slide{width:min(900px,100%);animation:fadein .28s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slide .kicker{font-size:14px;font-weight:600;color:var(--violet);margin-bottom:14px}
.slide h2{font-size:clamp(28px,4.6vw,46px);font-weight:800;line-height:1.18;margin-bottom:18px}

.typing{font-size:12.5px;color:var(--ink-3);padding-left:4px}

.drawer-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.drawer-head h3{font-size:16px;font-weight:800}
.drawer-body{flex:1;min-height:0;padding:16px 18px 18px;display:flex;flex-direction:column}
.drawer .chat{height:auto;flex:1;min-height:0}
.fab{position:fixed;right:20px;bottom:20px;z-index:120;border-radius:999px;padding:13px 20px;box-shadow:0 12px 30px rgba(59,91,255,.32)}
.fab .badge{background:#fff;color:var(--blue);border-radius:999px;font-size:11.5px;padding:1px 7px;font-weight:700}

/* responsive */
@media (max-width:1040px){

  .preview-scroll{max-height:none}

  .block{padding:20px}
  .topbar .wrap{height:56px}
  .anchorbar{top:56px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}

/* ---------------- small helpers ---------------- */
function fmtDate(d){
  if(!d) return '';
  const p = d.split('-');
  if(p.length !== 3) return d;
  return `${p[0]}. ${p[1]}. ${p[2]}`;
}
function initial(n){ return n ? n.trim().slice(-2) : '?'; }
function nonEmpty(arr, keys){
  return (arr||[]).filter(it => keys.some(k => (it[k]||'').toString().trim() !== ''));
}

/* ---------------- app ---------------- */
function App(){
  const [screen, setScreen] = useState('home');
  const [project, setProject] = useState(() => clone(SAMPLE));
  const [draftTemplate, setDraftTemplate] = useState('data');
  const [room, setRoom] = useState(() => clone(SAMPLE_ROOM));
  const [me, setMe] = useState(null);
  const [chat, setChat] = useState(() => clone(SAMPLE_CHAT));
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);

  const say = useCallback((msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 3600);
  }, []);

  const go = useCallback((s) => {
    setScreen(s);
    window.scrollTo({top:0, behavior:'auto'});
  }, []);

  const startNew = () => { setProject(clone(EMPTY)); setDraftTemplate('data'); go('template'); };
  const startSample = () => { setProject(clone(SAMPLE)); setDraftTemplate('data'); go('result'); };

  const update = useCallback((patch) => setProject(p => ({...p, ...patch})), []);

  if(screen === 'present'){
    return <Present project={project} setProject={setProject} onExit={() => go('result')} toast={toast} say={say} />;
  }

  return (
    <React.Fragment>
      <header className="topbar">
        <div className="wrap">
          <button className="brand" onClick={() => go('home')} aria-label="Teamfolio 홈으로">
            <span className="mark" aria-hidden="true"></span>Teamfolio

          <span className="spacer"></span>

          {screen !== 'workspace' && <button className="btn btn-ghost btn-sm" onClick={() => go('workspace')}>팀 작업 공간</button>}

      {screen === 'workspace' && (
        <Workspace room={room} setRoom={setRoom} me={me} setMe={setMe} project={project}
          chat={chat} setChat={setChat}

  );
}

  const set = (k) => (v) => setProject(p => ({...p, [k]:v}));
  const setList = (k, i, field, v) => setProject(p => {
    const arr = p[k].slice(); arr[i] = {...arr[i], [field]:v}; return {...p, [k]:arr};
  });
  const addItem = (k, blank) => setProject(p => ({...p, [k]:[...p[k], blank]}));
  const removeItem = (k, i) => setProject(p => ({...p, [k]:p[k].filter((_,x) => x !== i)}));
  const moveItem = (k, i, d) => setProject(p => {
    const arr = p[k].slice(); const j = i + d;
    if(j < 0 || j >= arr.length) return p;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    return {...p, [k]:arr};
  });

  const jump = (id) => {
    setActive(id);
    setTab('form');
    const el = document.getElementById('fs-' + id);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  };

  const addTool = () => {
    const v = toolInput.trim();
    if(!v) return;
    if((project.tools||[]).includes(v)){ setToolInput(''); return; }
    setProject(p => ({...p, tools:[...(p.tools||[]), v]}));
    setToolInput('');
  };

  const tpl = TEMPLATES.find(t => t.id === project.template) || TEMPLATES[0];

  return (
    <main className="wrap editor">
      <nav className="side" aria-label="작성 항목">
        {SECTIONS.map((s, i) => (
          <button key={s.id} aria-current={active === s.id} onClick={() => jump(s.id)}>
            <span className="num">{i+1}</span>{s.name}
          </button>
        ))}
      </nav>

      <div className="form">
        <div className="mobile-switch" role="group" aria-label="보기 전환">
          <button aria-pressed={tab === 'form'} onClick={() => setTab('form')}>작성하기</button>
          <button aria-pressed={tab === 'preview'} onClick={() => setTab('preview')}>미리보기</button>
        </div>

        <div className={tab === 'preview' ? 'hide-m' : ''} style={{display:'flex', flexDirection:'column', gap:'16px'}}>
          <div className="steps">
            <span>1 템플릿 선택</span><span className="sep"></span><b>2 내용 작성</b><span className="sep"></span><span>3 페이지 완성</span>
            <span className="chip blue" style={{marginLeft:'4px'}}>{tpl.name}</span>
          </div>

          {/* 기본 정보 */}
          <section className="card fieldset" id="fs-basic">
            <h3>기본 정보</h3>
            <p className="hint">페이지 맨 위에 그대로 나타나는 내용입니다.</p>
            <div className="field">
              <label htmlFor="f-title">프로젝트명</label>
              <input id="f-title" className="input" value={project.title} onChange={e => set('title')(e.target.value)} placeholder="예: 부산 축제 다국어 챗봇" />
            </div>
            <div className="field">
              <label htmlFor="f-tagline">프로젝트 한 줄 소개</label>
              <input id="f-tagline" className="input" value={project.tagline} onChange={e => set('tagline')(e.target.value)} placeholder="무엇을 만들었는지 한 문장으로" />
            </div>
            <div className="field">
              <label htmlFor="f-bg">프로젝트 배경 및 해결하려는 문제</label>
              <textarea id="f-bg" className="textarea" value={project.background} onChange={e => set('background')(e.target.value)} placeholder="왜 이 주제를 골랐고, 어떤 문제를 풀려고 했는지 적어보세요." />
            </div>
          </section>

          {/* 팀 구성 */}
          <section className="card fieldset" id="fs-team">
            <h3>팀 구성</h3>
            <p className="hint">팀원마다 담당을 적어두면 평가나 회고에서 찾기 쉽습니다.</p>
            <div className="field">
              <label htmlFor="f-team">팀명</label>
              <input id="f-team" className="input" value={project.teamName} onChange={e => set('teamName')(e.target.value)} placeholder="예: 라벨링사이다" />
            </div>
            {project.members.map((m,i) => (
              <div className="rowcard" key={i}>
                <div className="rowcard-head">
                  <span>팀원 {i+1}</span>
                  <button className="del" onClick={() => removeItem('members', i)}>삭제</button>
                </div>
                <div className="two">
                  <input className="input" value={m.name} onChange={e => setList('members', i, 'name', e.target.value)} placeholder="이름" />
                  <input className="input" value={m.role} onChange={e => setList('members', i, 'role', e.target.value)} placeholder="담당 역할" />
                </div>
              </div>
            ))}
            <button className="add" onClick={() => addItem('members', {name:'', role:''})}>팀원 추가</button>
          </section>

          {/* 일정과 진행률 */}
          <section className="card fieldset" id="fs-progress">
            <h3>일정과 진행률</h3>
            <p className="hint">단계별 진행률을 넣으면 페이지에 전체 진행률이 자동으로 계산됩니다.</p>
            <div className="two">
              <div className="field">
                <label htmlFor="f-ps">시작일</label>
                <input id="f-ps" type="date" className="input" value={project.periodStart} onChange={e => set('periodStart')(e.target.value)} />
              </div>
              <div className="field">
                <label htmlFor="f-pe">종료일</label>
                <input id="f-pe" type="date" className="input" value={project.periodEnd} onChange={e => set('periodEnd')(e.target.value)} />
              </div>
            </div>
            <div className="field"><label>진행 단계와 진행률</label></div>
            {project.stages.map((s,i) => (
              <div className="rowcard" key={i}>
                <div className="rowcard-head">
                  <span>단계 {i+1}</span>
                  <button className="del" onClick={() => removeItem('stages', i)}>삭제</button>
                </div>
                <input className="input" value={s.name} onChange={e => setList('stages', i, 'name', e.target.value)} placeholder="단계 이름 (예: 1차 라벨링)" style={{marginBottom:'9px'}} />
                <div style={{display:'flex', alignItems:'center', gap:'12px'}}>
                  <input className="range" type="range" min="0" max="100" step="5" value={s.percent}
                    onChange={e => setList('stages', i, 'percent', Number(e.target.value))} aria-label={(s.name || '단계 ' + (i+1)) + ' 진행률'} />
                  <span style={{fontVariantNumeric:'tabular-nums', fontWeight:600, width:'46px', textAlign:'right'}}>{s.percent}%</span>
                </div>
              </div>
            ))}
            <button className="add" onClick={() => addItem('stages', {name:'', percent:0})}>단계 추가</button>

            <div className="field" style={{marginTop:'18px'}}><label>주요 일정</label></div>
            {project.schedules.map((s,i) => (
              <div className="rowcard" key={i}>
                <div className="rowcard-head">
                  <span>일정 {i+1}</span>
                  <button className="del" onClick={() => removeItem('schedules', i)}>삭제</button>
                </div>
                <div className="two" style={{marginBottom:'9px'}}>
                  <input type="date" className="input" value={s.date} onChange={e => setList('schedules', i, 'date', e.target.value)} />
                  <select className="input" value={s.status} onChange={e => setList('schedules', i, 'status', e.target.value)}>
                    <option>예정</option><option>진행 중</option><option>완료</option>
                  </select>
                </div>
                <input className="input" value={s.title} onChange={e => setList('schedules', i, 'title', e.target.value)} placeholder="일정 내용" />
                <div className="notifybox">
                  <label className="switch">
                    <input type="checkbox" checked={!!s.notify} onChange={e => setList('schedules', i, 'notify', e.target.checked)} />
                    이 날짜에 카카오톡 알림 보내기
                  </label>
                  {s.notify && (
                    <div className="two" style={{marginTop:'9px'}}>
                      <select className="input" value={s.notifyWhen || '당일 아침 9시'} onChange={e => setList('schedules', i, 'notifyWhen', e.target.value)}>
                        <option>당일 아침 9시</option>
                        <option>1일 전 저녁 8시</option>
                        <option>3일 전 저녁 8시</option>
                        <option>일주일 전 저녁 8시</option>
                      </select>
                      <input className="input" value={s.notifyTo || ''} onChange={e => setList('schedules', i, 'notifyTo', e.target.value)} placeholder="받을 사람 (예: 전체 팀원)" />
                    </div>
                  )}
                </div>
              </div>
            ))}
            <button className="add" onClick={() => addItem('schedules', {date:'', title:'', status:'예정', notify:false, notifyWhen:'당일 아침 9시', notifyTo:'전체 팀원'})}>일정 추가</button>
            <p className="hint" style={{marginTop:'10px', marginBottom:0}}>알림은 팀 작업 공간의 카카오톡 팀 채팅방으로 갑니다. 시제품에서는 발송 대신 미리보기만 확인할 수 있습니다.</p>
          </section>

          {/* 회의록 */}
          <section className="card fieldset" id="fs-meetings">
            <h3>회의록</h3>
            <p className="hint">결정한 내용만 짧게 남겨도 충분합니다.</p>
            {project.meetings.map((m,i) => (
              <div className="rowcard" key={i}>
                <div className="rowcard-head">
                  <span>회의 {i+1}</span>
                  <button className="del" onClick={() => removeItem('meetings', i)}>삭제</button>
                </div>
                <div className="two" style={{marginBottom:'9px'}}>
                  <input type="date" className="input" value={m.date} onChange={e => setList('meetings', i, 'date', e.target.value)} />
                  <input className="input" value={m.attendees} onChange={e => setList('meetings', i, 'attendees', e.target.value)} placeholder="참석자" />
                </div>
                <input className="input" value={m.title} onChange={e => setList('meetings', i, 'title', e.target.value)} placeholder="회의 제목" style={{marginBottom:'9px'}} />
                <textarea className="textarea" style={{minHeight:'72px'}} value={m.notes} onChange={e => setList('meetings', i, 'notes', e.target.value)} placeholder="결정한 내용" />
              </div>
            ))}
            <button className="add" onClick={() => addItem('meetings', {date:'', title:'', attendees:'', notes:''})}>회의록 추가</button>
          </section>

          {/* 도구와 산출물 */}
          <section className="card fieldset" id="fs-tools">
            <h3>도구와 산출물</h3>
            <p className="hint">쓴 도구와 결과물 링크를 모아두면 공유할 때 따로 찾지 않아도 됩니다.</p>
            <div className="field">
              <label htmlFor="f-tool">사용 도구</label>
              <div className="tagrow">
                <input id="f-tool" className="input" value={toolInput}
                  onChange={e => setToolInput(e.target.value)}
                  onKeyDown={e => { if(e.key === 'Enter'){ e.preventDefault(); addTool(); } }}
                  placeholder="도구 이름을 적고 추가를 누르세요" />
                <button className="btn btn-outline" onClick={addTool}>추가</button>
              </div>
              {(project.tools||[]).length > 0 && (
                <div className="chiplist" style={{marginTop:'8px'}}>
                  {project.tools.map((t,i) => (
                    <span className="tagchip" key={i}>{t}
                      <button onClick={() => setProject(p => ({...p, tools:p.tools.filter((_,x) => x !== i)}))} aria-label={t + ' 삭제'}>×</button>
                    </span>
                  ))}
                </div>
              )}
            </div>
            <div className="field"><label>산출물</label></div>
            {project.outputs.map((o,i) => (
              <div className="rowcard" key={i}>
                <div className="rowcard-head">
                  <span>산출물 {i+1}</span>
                  <button className="del" onClick={() => removeItem('outputs', i)}>삭제</button>
                </div>
                <input className="input" value={o.name} onChange={e => setList('outputs', i, 'name', e.target.value)} placeholder="산출물 이름" style={{marginBottom:'9px'}} />
                <input className="input" value={o.link} onChange={e => setList('outputs', i, 'link', e.target.value)} placeholder="링크 (https://)" style={{marginBottom:'9px'}} />
                <input className="input" value={o.note} onChange={e => setList('outputs', i, 'note', e.target.value)} placeholder="간단한 설명" />
              </div>
            ))}
            <button className="add" onClick={() => addItem('outputs', {name:'', link:'', note:''})}>산출물 추가</button>
          </section>

          {/* 과정과 문제 해결 */}
          <section className="card fieldset" id="fs-story">
            <h3>과정과 문제 해결</h3>
            <p className="hint">막혔던 지점과 해결 방법은 평가에서 가장 자주 물어보는 부분입니다.</p>
            <div className="field"><label>프로젝트 진행 과정</label></div>
            {project.process.map((s,i) => (
              <div className="rowcard" key={i}>
                <div className="rowcard-head">
                  <span>{i+1}단계</span>
                  <button className="del" onClick={() => removeItem('process', i)}>삭제</button>
                </div>
                <input className="input" value={s.title} onChange={e => setList('process', i, 'title', e.target.value)} placeholder="단계 제목" style={{marginBottom:'9px'}} />
                <textarea className="textarea" style={{minHeight:'72px'}} value={s.desc} onChange={e => setList('process', i, 'desc', e.target.value)} placeholder="무엇을 어떻게 했는지" />
              </div>
            ))}
            <button className="add" onClick={() => addItem('process', {title:'', desc:''})}>단계 추가</button>

            <div className="field" style={{marginTop:'18px'}}><label>문제점과 해결 과정</label></div>
            {project.problems.map((p,i) => (
              <div className="rowcard" key={i}>
                <div className="rowcard-head">
                  <span>문제 {i+1}</span>
                  <button className="del" onClick={() => removeItem('problems', i)}>삭제</button>
                </div>
                <textarea className="textarea" style={{minHeight:'64px', marginBottom:'9px'}} value={p.problem} onChange={e => setList('problems', i, 'problem', e.target.value)} placeholder="어떤 문제가 있었나요" />
                <textarea className="textarea" style={{minHeight:'64px'}} value={p.solution} onChange={e => setList('problems', i, 'solution', e.target.value)} placeholder="어떻게 해결했나요" />
              </div>
            ))}
            <button className="add" onClick={() => addItem('problems', {problem:'', solution:''})}>문제 추가</button>
          </section>

          {/* 결과와 출처 */}
          <section className="card fieldset" id="fs-result">
            <h3>결과와 출처</h3>
            <p className="hint">숫자로 말할 수 있는 성과가 있다면 함께 적어보세요.</p>
            <div className="field">
              <label htmlFor="f-result">최종 결과 및 성과</label>
              <textarea id="f-result" className="textarea" value={project.result} onChange={e => set('result')(e.target.value)} placeholder="무엇을 완성했고, 어떤 점이 달라졌는지" />
            </div>
            <div className="field"><label>성과 지표</label></div>
            {project.metrics.map((m,i) => (
              <div className="rowcard" key={i}>
                <div className="rowcard-head">
                  <span>지표 {i+1}</span>
                  <button className="del" onClick={() => removeItem('metrics', i)}>삭제</button>
                </div>
                <div className="two">
                  <input className="input" value={m.value} onChange={e => setList('metrics', i, 'value', e.target.value)} placeholder="숫자 (예: 12,480건)" />
                  <input className="input" value={m.label} onChange={e => setList('metrics', i, 'label', e.target.value)} placeholder="설명 (예: 구축한 라벨)" />
                </div>
              </div>
            ))}
            <button className="add" onClick={() => addItem('metrics', {label:'', value:''})}>지표 추가</button>

            <div className="field" style={{marginTop:'18px'}}><label>참고자료와 출처</label></div>
            {project.references.map((r,i) => (
              <div className="rowcard" key={i}>
                <div className="rowcard-head">
                  <span>자료 {i+1}</span>
                  <button className="del" onClick={() => removeItem('references', i)}>삭제</button>
                </div>
                <div className="two">
                  <input className="input" value={r.title} onChange={e => setList('references', i, 'title', e.target.value)} placeholder="자료 제목" />
                  <input className="input" value={r.source} onChange={e => setList('references', i, 'source', e.target.value)} placeholder="출처" />
                </div>
              </div>
            ))}
            <button className="add" onClick={() => addItem('references', {title:'', source:''})}>참고자료 추가</button>
          </section>

          {/* 발표 슬라이드 */}
          <section className="card fieldset" id="fs-slides">
            <h3>발표 슬라이드</h3>
            <p className="hint">입력한 내용으로 만들어지는 기본 4장에 원하는 만큼 슬라이드를 더할 수 있습니다.</p>
            <div className="slidetoggles">
              {AUTO_SLIDES.map(a => (
                <label className="slidetoggle" key={a.key}>
                  <input type="checkbox" checked={(project.autoSlides || {})[a.key] !== false}
                    onChange={e => setProject(p => ({...p, autoSlides:{...(p.autoSlides||{}), [a.key]:e.target.checked}}))} />
                  {a.name}
                  <span className="sk">{a.from}</span>
                </label>
              ))}
            </div>
            <div className="field" style={{marginTop:'16px'}}><label>직접 추가한 슬라이드</label></div>
            {(project.extraSlides || []).map((s,i) => (
              <div className="rowcard" key={i}>
                <div className="rowcard-head">
                  <span>추가 슬라이드 {i+1}</span>
                  <div style={{display:'flex', gap:'8px', alignItems:'center'}}>
                    <div className="moves">
                      <button onClick={() => moveItem('extraSlides', i, -1)} disabled={i === 0} aria-label="위로">▲</button>
                      <button onClick={() => moveItem('extraSlides', i, 1)} disabled={i === project.extraSlides.length - 1} aria-label="아래로">▼</button>
                    </div>
                    <button className="del" onClick={() => removeItem('extraSlides', i)}>삭제</button>
                  </div>
                </div>
                <div className="two" style={{marginBottom:'9px'}}>
                  <input className="input" value={s.kicker} onChange={e => setList('extraSlides', i, 'kicker', e.target.value)} placeholder="분류 (예: 데모)" />
                  <input className="input" value={s.title} onChange={e => setList('extraSlides', i, 'title', e.target.value)} placeholder="슬라이드 제목" />
                </div>
                <textarea className="textarea" style={{minHeight:'64px', marginBottom:'9px'}} value={s.text} onChange={e => setList('extraSlides', i, 'text', e.target.value)} placeholder="설명 문장" />
                <textarea className="textarea" style={{minHeight:'64px'}} value={s.bullets} onChange={e => setList('extraSlides', i, 'bullets', e.target.value)} placeholder="한 줄에 하나씩 적으면 목록으로 표시됩니다" />
              </div>
            ))}
            <button className="add" onClick={() => addItem('extraSlides', {kicker:'', title:'', text:'', bullets:''})}>슬라이드 추가</button>
            <p className="hint" style={{marginTop:'10px', marginBottom:0}}>발표 모드 안에서도 바로 추가할 수 있습니다. 현재 {buildSlides(project).length}장입니다.</p>
          </section>

          <div style={{display:'flex', gap:'10px', flexWrap:'wrap'}}>
            <button className="btn btn-outline" onClick={onBack}>템플릿 다시 고르기</button>
            <button className="btn btn-primary" onClick={() => { if(!project.title.trim()){ say('프로젝트명을 입력하면 페이지를 만들 수 있습니다.'); jump('basic'); return; } onDone(); }}>
              프로젝트 페이지 완성하기
            </button>
          </div>
        </div>
      </div>

      <div className={'preview-col ' + (tab === 'form' ? 'hide-m' : '')}>
        <div className="preview-head">
          <span className="t">실시간 미리보기</span>
          <span className="t">입력하는 대로 반영됩니다</span>
        </div>
        <div className="preview-frame">
          <div className="preview-bar">
            <span className="pd"></span><span className="pd"></span><span className="pd"></span>
            <span className="preview-url">teamfolio.kr/p/{(project.title || '내-프로젝트').trim().replace(/\s+/g,'-')}</span>
          </div>
          <div className="preview-scroll">
            <PreviewBody project={project} />
          </div>
        </div>
      </div>
    </main>
  );
}

/* ---------------- preview (compact) ---------------- */
function PreviewBody({project}){
  const members = nonEmpty(project.members, ['name','role']);
  const stages = nonEmpty(project.stages, ['name']);
  const overall = useMemo(() => {
    const s = nonEmpty(project.stages, ['name']);
    if(!s.length) return 0;
    return Math.round(s.reduce((a,b) => a + (Number(b.percent)||0), 0) / s.length);
  }, [project.stages]);
  const outputs = nonEmpty(project.outputs, ['name','link']);

  return (
    <div style={{display:'flex', flexDirection:'column', gap:'12px'}}>
      <div className="card" style={{padding:'18px'}}>
        <h2 style={{fontSize:'20px', fontWeight:800, lineHeight:1.25}}>{project.title || '프로젝트명을 입력하면 여기에 표시됩니다'}</h2>

/* ---------------- team chat ---------------- */
function nowLabel(){
  const d = new Date();
  const h = d.getHours();
  const ap = h < 12 ? '오전' : '오후';
  const hh = h % 12 === 0 ? 12 : h % 12;
  return ap + ' ' + hh + ':' + String(d.getMinutes()).padStart(2,'0');
}

function ChatPanel({chat, setChat, me, room, project}){
  const [text, setText] = useState('');
  const [typing, setTyping] = useState(null);
  const logRef = useRef(null);
  const replyIdx = useRef(0);
  const timers = useRef([]);
  const myName = (me && me.name) || '나';

  useEffect(() => {
    if(logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight;
  }, [chat, typing]);

  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  const send = () => {
    const v = text.trim();
    if(!v) return;
    setChat(c => [...c, {who:myName, text:v, when:nowLabel(), mine:true}]);
    setText('');
    const r = DEMO_REPLIES[replyIdx.current % DEMO_REPLIES.length];
    replyIdx.current += 1;
    setTyping(r.who);
    timers.current.push(setTimeout(() => {
      setTyping(null);
      setChat(c => [...c, {who:r.who, text:r.text, when:nowLabel(), demo:true}]);
    }, 1400));
  };

  return (
    <div className="chat">
      <div className="chat-log" ref={logRef}>
        {chat.map((m,i) => (
          <div className={'msg' + (m.mine ? ' mine' : '')} key={i}>
            <span className="mav">{initial(m.who)}</span>
            <div className="mbody">
              <div className="mwho">{m.who}{m.demo && <span className="demotag">시제품 예시 응답</span>}</div>
              <div className="bubble">{m.text}</div>
              <div className="mtime">{m.when}</div>
            </div>
          </div>
        ))}
        {typing && <p className="typing">{typing}님이 입력 중…</p>}
      </div>
      <div className="chat-input">
        <input className="input" value={text} onChange={e => setText(e.target.value)}
          onKeyDown={e => { if(e.key === 'Enter'){ e.preventDefault(); send(); } }}
          placeholder={(project && project.title ? project.title + ' 관련 피드백' : '메시지를 입력하세요')} />
        <button className="btn btn-primary" onClick={send}>보내기</button>
      </div>
    </div>
  );
}

/* ---------------- present ---------------- */
const AUTO_SLIDES = [
  {key:'intro', name:'프로젝트 소개', from:'제목과 팀 정보'},
  {key:'problem', name:'문제 정의', from:'배경과 문제점'},
  {key:'process', name:'진행 과정', from:'단계와 진행률'},
  {key:'result', name:'핵심 결과', from:'최종 결과와 지표'}
];

function buildSlides(project){
  const members = nonEmpty(project.members, ['name','role']);
  const process = nonEmpty(project.process, ['title','desc']);
  const problems = nonEmpty(project.problems, ['problem','solution']);
  const metrics = nonEmpty(project.metrics, ['label','value']);
  const stages = nonEmpty(project.stages, ['name']);
  const overall = stages.length ? Math.round(stages.reduce((a,b) => a + (Number(b.percent)||0), 0) / stages.length) : 0;
  const on = project.autoSlides || {};

  const autos = [
    {key:'intro', kicker:'프로젝트 소개', title: project.title || '제목 없는 프로젝트', text: project.tagline,
      list:[
        project.teamName ? '팀 ' + project.teamName : null,
        members.length ? members.map(m => m.name).filter(Boolean).join(', ') : null,
        (project.periodStart || project.periodEnd) ? fmtDate(project.periodStart) + ' – ' + fmtDate(project.periodEnd) : null
      ].filter(Boolean)},
    {key:'problem', kicker:'문제 정의', title:'무엇을 해결하려 했나',
      text: project.background || '배경을 입력하면 이 화면에 표시됩니다.',
      list: problems.slice(0,3).map(p => p.problem)},
    {key:'process', kicker:'진행 과정', title:'어떻게 진행했나',
      text: stages.length ? '전체 진행률 ' + overall + '%' : '',
      list: process.map((p,i) => (i+1) + '. ' + p.title)},
    {key:'result', kicker:'핵심 결과', title:'무엇이 달라졌나',
      text: project.result || '최종 결과를 입력하면 이 화면에 표시됩니다.',
      list: metrics.map(m => m.value + ' — ' + m.label)}
  ].filter(s => on[s.key] !== false);

  const extras = (project.extraSlides || [])
    .map((s, xi) => ({...s, xi}))
    .filter(s => (s.title || '').trim() || (s.text || '').trim() || (s.bullets || '').trim())
    .map(s => ({
      key:'x' + s.xi, xi:s.xi, custom:true,
      kicker: s.kicker || '추가 슬라이드',
      title: s.title || '제목 없는 슬라이드',
      text: s.text,
      list: (s.bullets || '').split('\n').map(t => t.trim()).filter(Boolean)
    }));

  const all = [...autos, ...extras];
  return all.length ? all : [{key:'none', kicker:'발표 모드', title:'보여줄 슬라이드가 없습니다', text:'기본 슬라이드를 켜거나 슬라이드를 추가해보세요.', list:[]}];
}

function Present({project, setProject, onExit, toast, say}){
  const slides = useMemo(() => buildSlides(project), [project]);
  const [i, setI] = useState(0);
  const [adding, setAdding] = useState(false);
  const [draft, setDraft] = useState({kicker:'', title:'', text:'', bullets:''});

  const prev = () => setI(v => Math.max(0, v - 1));
  const next = () => setI(v => Math.min(slides.length - 1, v + 1));

  useEffect(() => { if(i > slides.length - 1) setI(slides.length - 1); }, [slides.length, i]);

  useEffect(() => {
    const onKey = (e) => {
      if(adding){ if(e.key === 'Escape') setAdding(false); return; }
      if(e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); next(); }
      if(e.key === 'ArrowLeft') prev();
      if(e.key === 'Escape') onExit();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [slides.length, adding]);

  const saveDraft = () => {
    if(!draft.title.trim() && !draft.text.trim()){ say('슬라이드 제목이나 내용을 하나는 적어주세요.'); return; }
    setProject(p => ({...p, extraSlides:[...(p.extraSlides || []), draft]}));
    setDraft({kicker:'', title:'', text:'', bullets:''});
    setAdding(false);
    setI(slides.length);
  };

  const removeCurrent = () => {
    const s = slides[i];
    if(!s.custom) return;
    setProject(p => ({...p, extraSlides:(p.extraSlides || []).filter((_,x) => x !== s.xi)}));
    setI(v => Math.max(0, v - 1));
  };

  const s = slides[i];
  return (
    <div className="present">
      <div className="present-top">
        <span className="mark" aria-hidden="true"></span>
        <strong style={{fontFamily:'"Gothic A1",sans-serif', letterSpacing:'-.02em'}}>{project.title || '제목 없는 프로젝트'}</strong>
        <span className="spacer"></span>
        <span className="slidecount hide-m">방향키로도 넘길 수 있습니다</span>
        {s.custom && <button className="btn btn-ghost btn-sm" onClick={removeCurrent}>이 슬라이드 삭제</button>}
        <button className="btn btn-outline btn-sm" onClick={() => setAdding(true)}>슬라이드 추가</button>
        <button className="btn btn-outline btn-sm" onClick={onExit}>발표 모드 끝내기</button>
      </div>
      <div className="present-body">
        <div className="slide" key={i}>
          <div className="kicker">{s.kicker}</div>
          <h2>{s.title}</h2>
          {s.text && <p>{s.text}</p>}
          {s.list && s.list.length > 0 && (
            <ul>
              {s.list.map((t,x) => <li key={x}><span className="b"></span><span>{t}</span></li>)}
            </ul>
          )}
        </div>
      </div>
      <div className="present-bottom">
        <div className="pdots" aria-hidden="true">
          {slides.map((_,x) => <i key={x} className={x <= i ? 'on' : ''}></i>)}
        </div>
        <span className="slidecount">{i+1} / {slides.length}</span>
        <div style={{display:'flex', gap:'8px'}}>
          <button className="btn btn-outline" onClick={prev} disabled={i === 0}>이전</button>
          <button className="btn btn-primary" onClick={next} disabled={i === slides.length - 1}>다음</button>
        </div>
      </div>

      {adding && (
        <div className="addslide" role="dialog" aria-label="슬라이드 추가">
          <h3 style={{fontSize:'16px', fontWeight:800, marginBottom:'12px'}}>슬라이드 추가</h3>
          <div className="two" style={{marginBottom:'9px'}}>
            <input className="input" value={draft.kicker} onChange={e => setDraft({...draft, kicker:e.target.value})} placeholder="분류 (예: 데모)" />
            <input className="input" value={draft.title} onChange={e => setDraft({...draft, title:e.target.value})} placeholder="슬라이드 제목" autoFocus />
          </div>
          <textarea className="textarea" style={{minHeight:'60px', marginBottom:'9px'}} value={draft.text} onChange={e => setDraft({...draft, text:e.target.value})} placeholder="설명 문장" />
          <textarea className="textarea" style={{minHeight:'60px'}} value={draft.bullets} onChange={e => setDraft({...draft, bullets:e.target.value})} placeholder="한 줄에 하나씩 적으면 목록이 됩니다" />
          <div style={{display:'flex', gap:'10px', marginTop:'12px', justifyContent:'flex-end'}}>
            <button className="btn btn-ghost" onClick={() => setAdding(false)}>취소</button>
            <button className="btn btn-primary" onClick={saveDraft}>맨 뒤에 추가</button>
          </div>
        </div>
      )}
      {toast && <div className="toast" role="status">{toast}</div>}
    </div>
  );
}

/* ---------------- team workspace ---------------- */
function makeCode(){
  const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for(let i = 0; i < 4; i++) out += cs[Math.floor(Math.random() * cs.length)];
  return 'TF-' + out;
}
const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim());

function Workspace({room, setRoom, me, setMe, project, chat, setChat, onEdit, onView, say}){
  const [mode, setMode] = useState('join');
  const [form, setForm] = useState({name:'', email:'', code:'', roomName:''});
  const f = (k) => (e) => setForm({...form, [k]:e.target.value});

  const createRoom = () => {
    if(!form.name.trim()){ say('이름을 입력해주세요.'); return; }
    if(!isEmail(form.email)){ say('이메일 형식을 확인해주세요. 예: name@example.ac.kr'); return; }
    if(!form.roomName.trim()){ say('방 이름을 입력해주세요.'); return; }
    const code = makeCode();
    const leader = {name:form.name.trim(), email:form.email.trim(), role:'팀장', leader:true, state:'작업 중'};
    setRoom({
      name:form.roomName.trim(), code, created:new Date().toISOString().slice(0,10),
      members:[leader], tasks:[], activity:[{who:form.name.trim(), what:'방을 만들었습니다.', when:'방금'}]
    });
    setMe(leader);
    say('방을 만들었습니다. 초대 코드 ' + code + '를 팀원에게 알려주세요.');
  };

  const joinRoom = () => {
    if(!form.name.trim()){ say('이름을 입력해주세요.'); return; }
    if(!isEmail(form.email)){ say('이메일 형식을 확인해주세요. 예: name@example.ac.kr'); return; }
    if(form.code.trim().toUpperCase() !== room.code.toUpperCase()){
      say('그 코드로 만들어진 방이 없습니다. 지금 열려 있는 예시 방 코드는 ' + room.code + '입니다.');
      return;
    }
    const exists = room.members.find(m => m.email.toLowerCase() === form.email.trim().toLowerCase());
    const person = exists || {name:form.name.trim(), email:form.email.trim(), role:'역할 미정', leader:false, state:'방금 참여'};
    if(!exists){
      setRoom(r => ({
        ...r,
        members:[...r.members, person],
        activity:[{who:person.name, what:'방에 참여했습니다.', when:'방금'}, ...r.activity]
      }));
    }
    setMe(person);
  };

  const toggleTask = (i) => setRoom(r => ({...r, tasks:r.tasks.map((t,x) => x === i ? {...t, done:!t.done} : t)}));

  if(!me){
    return (
      <main className="wrap">
        <div style={{padding:'38px 0 0'}}>
          <h1 style={{fontSize:'clamp(26px,4vw,36px)', fontWeight:800}}>팀 작업 공간</h1>
          <p style={{color:'var(--ink-2)', marginTop:'10px', maxWidth:'52ch'}}>
            팀장이 방을 만들고 코드를 알려주면, 팀원은 이메일로 들어와 같은 프로젝트를 함께 채웁니다.
          </p>
        </div>
        <div className="join">
          <div className="card joincard">
            <h3>방 참여하기</h3>
            <p className="j">팀장에게 받은 코드로 들어갑니다.</p>
            <input className="input" value={form.name} onChange={f('name')} placeholder="이름" />
            <input className="input" type="email" value={form.email} onChange={f('email')} placeholder="이메일" />
            <input className="input" value={form.code} onChange={f('code')} placeholder="초대 코드" style={{letterSpacing:'.08em'}} />
            <button className="btn btn-primary" onClick={joinRoom}>이 방에 들어가기</button>
            <p style={{fontSize:'12.5px', color:'var(--ink-3)'}}>지금 열려 있는 예시 방: {room.name} · 코드 {room.code}</p>
          </div>
          <div className="card joincard">
            <h3>방 만들기</h3>
            <p className="j">팀장이 방을 만들면 초대 코드가 생깁니다.</p>
            <input className="input" value={form.name} onChange={f('name')} placeholder="이름" />
            <input className="input" type="email" value={form.email} onChange={f('email')} placeholder="이메일" />
            <input className="input" value={form.roomName} onChange={f('roomName')} placeholder="방 이름 (예: 라벨링사이다 팀플방)" />
            <button className="btn btn-outline" onClick={createRoom}>방 만들고 팀장 되기</button>
            <p style={{fontSize:'12.5px', color:'var(--ink-3)'}}>새 방을 만들면 예시 방은 닫히고 새 방으로 바뀝니다.</p>
          </div>
        </div>
      </main>
    );
  }

  return (
    <main className="wrap">
      <div className="roomhead">
        <div>
          <h1>{room.name}</h1>
          <p style={{color:'var(--ink-2)', marginTop:'8px', fontSize:'14.5px'}}>
            {me.name}님으로 들어와 있습니다 · {me.email}
          </p>
        </div>
        <span className="spacer"></span>
        <span className="code">{room.code}</span>
        <button className="btn btn-outline btn-sm" onClick={() => say('시제품이라 초대 링크는 복사되지 않습니다. 실제 서비스에서는 teamfolio.kr/room/' + room.code + ' 주소와 초대 메일이 함께 발송됩니다.')}>초대 링크 복사</button>
        <button className="btn btn-ghost btn-sm" onClick={() => setMe(null)}>방 나가기</button>
      </div>

      <div className="room" style={{paddingTop:'24px'}}>
        <div style={{display:'flex', flexDirection:'column', gap:'16px'}}>
          <section className="card block" style={{padding:'22px'}}>
            <h2 style={{fontSize:'17px', fontWeight:800, marginBottom:'2px'}}>참여 중인 팀원</h2>
            <p className="bsub" style={{marginBottom:'12px'}}>{room.members.length}명</p>
            {room.members.map((m,i) => (
              <div className="mem" key={i}>
                <span className={'ava' + (i % 2 ? ' v' : '')}>{initial(m.name)}</span>
                <div style={{minWidth:0}}>
                  <div className="nm">{m.name}{m.leader && <span className="chip blue" style={{marginLeft:'7px', fontSize:'11.5px', padding:'2px 8px'}}>팀장</span>}</div>
                  <div className="me">{m.email}</div>
                </div>
                <span className={'state' + (m.state === '작업 중' || m.state === '방금 참여' ? ' on' : '')}>{m.state}</span>
              </div>
            ))}
          </section>

          <section className="card block" style={{padding:'22px'}}>
            <h2 style={{fontSize:'17px', fontWeight:800, marginBottom:'2px'}}>할 일</h2>
            <p className="bsub" style={{marginBottom:'8px'}}>체크하면 팀원 화면에도 반영됩니다</p>
            {room.tasks.length ? room.tasks.map((t,i) => (
              <label className={'task' + (t.done ? ' done' : '')} key={i}>
                <input type="checkbox" checked={t.done} onChange={() => toggleTask(i)} />
                <span>
                  <span className="tt">{t.title}</span>
                  <span className="to" style={{display:'block'}}>{t.owner}</span>
                </span>
              </label>
            )) : <p className="empty">아직 할 일이 없습니다.</p>}
          </section>
        </div>

        <div style={{display:'flex', flexDirection:'column', gap:'16px'}}>
          <section className="card block" style={{padding:'22px'}}>
            <h2 style={{fontSize:'17px', fontWeight:800, marginBottom:'2px'}}>이 방의 프로젝트</h2>
            <p className="bsub" style={{marginBottom:'16px'}}>한 페이지를 함께 채웁니다</p>
            <div style={{border:'1px solid var(--line)', borderRadius:'var(--r-sm)', padding:'18px'}}>
              <h3 style={{fontSize:'19px', fontWeight:800}}>{project.title || '제목 없는 프로젝트'}</h3>
              <p style={{color:'var(--ink-2)', fontSize:'14px', marginTop:'7px'}}>{project.tagline}</p>
              <div className="chiplist" style={{marginTop:'13px'}}>
                <span className="chip">팀원 {nonEmpty(project.members, ['name']).length}명</span>
                <span className="chip">일정 {nonEmpty(project.schedules, ['title']).length}건</span>
                <span className="chip">산출물 {nonEmpty(project.outputs, ['name']).length}건</span>
                {nonEmpty(project.schedules, ['title']).some(s => s.notify) && <span className="chip alarm">카톡 알림 켜짐</span>}
              </div>
              <div style={{display:'flex', gap:'10px', marginTop:'18px', flexWrap:'wrap'}}>
                <button className="btn btn-primary btn-sm" onClick={onEdit}>함께 편집하기</button>
                <button className="btn btn-outline btn-sm" onClick={onView}>프로젝트 페이지 보기</button>
              </div>
            </div>
            <p style={{fontSize:'12.5px', color:'var(--ink-3)', marginTop:'12px'}}>
              시제품에서는 내 브라우저에서만 편집됩니다. 실제 서비스에서는 같은 방의 팀원이 동시에 같은 페이지를 고칩니다.
            </p>
          </section>

          <section className="card block" style={{padding:'22px'}}>
            <h2 style={{fontSize:'17px', fontWeight:800, marginBottom:'2px'}}>팀 채팅</h2>
            <p className="bsub" style={{marginBottom:'14px'}}>프로젝트 이야기는 여기서만 하면 됩니다</p>
            <ChatPanel chat={chat} setChat={setChat} me={me} room={room} project={project} />
          </section>

          <section className="card block" style={{padding:'22px'}}>
            <h2 style={{fontSize:'17px', fontWeight:800, marginBottom:'2px'}}>최근 활동</h2>
            <p className="bsub" style={{marginBottom:'8px'}}>누가 무엇을 고쳤는지</p>
            {room.activity.length ? room.activity.map((a,i) => (
              <div className="act" key={i}>
                <span className="aw">{a.who}</span>
                <span>{a.what}</span>
                <span className="an">{a.when}</span>
              </div>
            )) : <p className="empty">아직 활동 기록이 없습니다.</p>}
          </section>
        </div>
      </div>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
